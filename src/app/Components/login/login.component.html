<div class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">
  <h1 class="text-4xl font-semibold text-blue-600 mb-10">Linked Posts</h1>

  <div class="bg-white shadow-md rounded-2xl w-full max-w-lg p-8">
    <h2 class="text-2xl font-semibold text-blue-600 mb-6">Login Now</h2>

    <form [formGroup] = "loginForm">

      <div class="mb-4">
        <input
          formControlName="email"
          type="email"
          placeholder="Type your email..."
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        />
      </div>

      <div class="mb-6">
        <input
          formControlName="password"
          type="password"
          placeholder="Type your password"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        />
      </div>
      <button
        type="submit"
        class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
      >
        Signin
      </button>
    </form>
    <p class="text-center text-sm text-gray-600 mt-4">
      Not registered?
      <a routerLink="/register" class="text-blue-600 hover:underline font-medium">Create account</a>
      
    </p>
  </div>
</div>
