<div class="min-h-screen bg-gray-100 flex flex-col items-center py-10">

    <h1 class="text-4xl font-bold text-blue-600 mb-6">Linked Posts</h1>

    <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-lg">
        <h2 class="text-2xl font-semibold text-blue-600 mb-6">Change Password</h2>

        <form [formGroup]="changePassword" class="space-y-5">
            <div>
                <input type="password" formControlName="password" placeholder="Enter current password" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 text-gray-700 placeholder-gray-400
                 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" />
            </div>
            <div>
                <input type="password" formControlName="newpassword" placeholder="Enter new password" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 text-gray-700 placeholder-gray-400
                 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" />
            </div>
            <div class="pt-2">
                <button routerLink="/login" type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl shadow-md transition duration-150">
                    Update Password
                </button>
            </div>
        </form>
    </div>
</div>
